<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HomeHunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HomeHunter</h1>
        <div id="filters">
            <select id="state-select"><option value="">Todos os Estados</option></select>
            <select id="city-select"><option value="">Todas as Cidades</option></select>
            <input type="number" id="min-price" placeholder="Preço Mín">
            <input type="number" id="max-price" placeholder="Preço Máx">
            <select id="sort-select">
                <option value="price,asc">Preço (menor)</option>
                <option value="price,desc">Preço (maior)</option>
                <option value="createdAt,desc">Mais recentes</option>
            </select>
            <select id="size-select">
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <button id="search-btn">Buscar</button>
        </div>
    </header>
    <main id="results-grid"></main>
    <script src="app.js"></script>
</body>
</html>
