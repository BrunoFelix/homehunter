<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HomeHunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="scope filter-bar">
            <div id="filters" class="cluster">
                <select id="state-select"><option value="">Todos os Estados</option></select>
                <select id="city-select"><option value="">Todas as Cidades</option></select>
                <select id="type-select">
                    <option value="">Todos os Tipos</option>
                    <option value="APARTAMENTO">Apartamento</option>
                    <option value="CASA">Casa</option>
                </select>
                <input type="number" id="min-price" placeholder="Preço Mín">
                <input type="number" id="max-price" placeholder="Preço Máx">
                <select id="sort-select">
                    <option value="announcedAt,desc">Mais recentes</option>
                    <option value="price,asc">Preço (menor)</option>
                    <option value="price,desc">Preço (maior)</option>
                </select>
                <select id="size-select">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <button id="search-btn">Buscar</button>
            </div>
        </div>
    </header>
    <div class="scope product-cards | -fluid-text">
  <div class="_card-list | grid" style="
      --grid--fill-mode: var(--product-cards--fill-mode, auto-fill);
      --grid--row-gap: var(--product-cards--gap, 1.5rem);
      --grid--column-gap: var(--product-cards--gap, 1.5rem);
      --grid--column-max-count: var(--product-cards--column-max-count, 4);
      --grid--column-min-width: var(--product-cards--column-min-width, 20rem);">
  </div>

  <div id="pagination-controls" class="cluster" style="justify-content: center; margin-top: 2rem; display: none;">
      <button id="prev-page">Anterior</button>
      <span id="page-info"></span>
      <button id="next-page">Próximo</button>
  </div>

  <!-- `display: none` can cause SVG filters to be ineffective in Firefox. -->
  <svg width="0" height="0" style="visibility: hidden; position: fixed;">
    <filter id="svg-inset-shadow">
      <feOffset in="SourceAlpha" dx="6" dy="8" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feComposite in="SourceAlpha" operator="out" />
      <feBlend in2="SourceGraphic" mode="multiply" />
    </filter>
  </svg>
</div>

    <script src="app.js"></script>
    <div id="image-modal" style="display:none;">
        <button id="close-modal">&times;</button>
        <div id="image-counter"></div>
        <div class="modal-content">
            <button id="prev-img">❮</button>
            <img id="modal-img" src="" alt="Ampliada">
            <button id="next-img">❯</button>
        </div>
    </div>
</body>
</html>
